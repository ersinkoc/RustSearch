[package]
name = "rustsearch-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "rustsearch-desktop"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
rustsearch-core.workspace = true
rustsearch-query.workspace = true
rustsearch-storage.workspace = true
rustsearch-windows.workspace = true
async-channel = "2.5"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = { version = "=0.5.1", default-features = false }
gpui-component-assets = "=0.5.1"

[dev-dependencies]
tempfile = "3.27"
