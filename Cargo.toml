[workspace]
members = [
    "crates/core",
    "crates/query",
    "crates/storage",
    "crates/windows-indexer",
    "crates/cli",
    "crates/desktop",
]
default-members = ["crates/cli"]
resolver = "2"

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.93"

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_WindowsProgramming", "Win32_Security", "Win32_Security_Authorization"] }
rustsearch-core = { path = "crates/core" }
rustsearch-query = { path = "crates/query" }
rustsearch-storage = { path = "crates/storage" }
rustsearch-windows = { path = "crates/windows-indexer" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
